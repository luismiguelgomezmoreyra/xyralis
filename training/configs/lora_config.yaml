lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  task_type: "CAUSAL_LM"

training:
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  bf16: false
  fp16: false
  eval_strategy: "no"
  eval_steps: 10
  save_strategy: "no"
  save_steps: 10
  load_best_model_at_end: false
  metric_for_best_model: "eval_loss"
  logging_steps: 1
  dataloader_drop_last: false

model:
  name: "LiquidAI/LFM2-VL-450M"
  gradient_checkpointing: false

dataset:
  max_length: 256
  num_workers: 0
  pin_memory: false
