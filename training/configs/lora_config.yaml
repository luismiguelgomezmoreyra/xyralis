lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  task_type: "CAUSAL_LM"

training:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  bf16: true
  fp16: false
  eval_strategy: "steps"
  eval_steps: 25
  save_strategy: "steps"
  save_steps: 50
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  logging_steps: 5
  dataloader_drop_last: true
  early_stopping_patience: 5

model:
  name: "LiquidAI/LFM2-VL-7B"
  gradient_checkpointing: true

dataset:
  max_length: 512
  num_workers: 2
  pin_memory: true
